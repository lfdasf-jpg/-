<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>情緒大冒險 - 未來焦慮挑戰</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
            overflow: hidden;
            background: #2c1e2f;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center 30%;
            background-repeat: no-repeat;
            transition: background-image 0.5s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
        }

        /* 全屏角色立繪（類似背景層） */
        #character-portrait {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 10;
            pointer-events: none;
            display: none;
        }

        /* 對話框區域，高於立繪 */
        .dialogue-wrapper {
            position: relative;
            z-index: 20;
            width: 90%;
            max-width: 1100px;
            margin-bottom: 40px;
        }

        #scene-info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            color: #fff;
            padding: 12px 20px;
            border-radius: 24px;
            border-left: 5px solid #ffb7c5;
            max-width: 320px;
            font-size: 0.85rem;
            z-index: 30;
            pointer-events: none;
            font-weight: 500;
        }
        #scene-info .scene-zh { font-size: 1rem; margin-bottom: 4px; }
        #scene-info .scene-en { font-size: 0.75rem; opacity: 0.8; font-style: italic; }

        #stats-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 12px 20px;
            width: 260px;
            z-index: 30;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .stat-item {
            margin-bottom: 10px;
        }
        .stat-label {
            color: #eee;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .stat-bar {
            width: 100%;
            height: 8px;
            background: #3a2c3f;
            border-radius: 10px;
            overflow: hidden;
        }
        .stat-fill {
            height: 100%;
            width: 50%;
            transition: width 0.3s ease;
        }
        #stress-fill { background: #ff6b6b; box-shadow: 0 0 6px #ff6b6b; }
        #calm-fill { background: #6bc9ff; box-shadow: 0 0 6px #6bc9ff; }

        #dialogue-box {
            background: rgba(255,255,255,0.97);
            border-radius: 28px;
            border: 2px solid #ffb7c5;
            padding: 24px 28px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.3);
        }

        #speaker {
            font-size: 1.4rem;
            font-weight: bold;
            color: #d66d75;
            margin-bottom: 12px;
            border-left: 4px solid #ffb7c5;
            padding-left: 15px;
        }

        #dialogue-text {
            font-size: 1.15rem;
            line-height: 1.55;
            color: #2d1b2e;
            min-height: 90px;
        }

        .dialogue-en {
            display: block;
            font-size: 0.9rem;
            color: #666;
            margin-top: 6px;
            font-style: italic;
            border-left: 2px solid #ffb7c5;
            padding-left: 10px;
        }

        .psych-note {
            margin-top: 18px;
            padding-top: 12px;
            border-top: 2px dashed #ffb7c5;
            color: #b34e5a;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .psych-note-en {
            display: block;
            font-size: 0.85rem;
            font-weight: normal;
            color: #b34e5a;
            margin-top: 6px;
            font-style: italic;
        }

        #options-area {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn, .continue-btn {
            background: white;
            border: 2px solid #ffb7c5;
            padding: 12px 18px;
            border-radius: 32px;
            font-size: 1rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: -2px 3px 8px rgba(0,0,0,0.08);
            width: 100%;
        }
        .option-btn:hover, .continue-btn:hover {
            background: #ffb7c5;
            color: white;
            transform: translateX(-5px);
        }
        .continue-btn {
            background: #6bc9ff;
            border-color: #3aa0e0;
            color: white;
            text-align: center;
            font-weight: bold;
        }
        .continue-btn:hover {
            background: #3aa0e0;
            transform: scale(1.02);
        }

        /* 壓力變化浮動提示 */
        .stat-toast {
            position: fixed;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #ffb7c5;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.2rem;
            z-index: 200;
            pointer-events: none;
            animation: fadeOut 1.5s forwards;
            white-space: nowrap;
        }
        @keyframes fadeOut {
            0% { opacity: 1; transform: translateX(-50%) translateY(0); }
            70% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); visibility: hidden; }
        }

        @media (max-width: 800px) {
            .dialogue-wrapper { width: 95%; }
        }
    </style>
</head>
<body>
<div id="game-container">
    <div id="scene-info">
        <div id="scene-zh" class="scene-zh">背景：大學畢業禮堂</div>
        <div id="scene-en" class="scene-en">Background: Graduation Hall</div>
    </div>
    <div id="stats-panel">
        <div class="stat-item">
            <div class="stat-label">😰 壓力 Stress <span id="stress-val">50%</span></div>
            <div class="stat-bar"><div id="stress-fill" class="stat-fill" style="width: 50%;"></div></div>
        </div>
        <div class="stat-item">
            <div class="stat-label">🌿 舒緩 Calm <span id="calm-val">50%</span></div>
            <div class="stat-bar"><div id="calm-fill" class="stat-fill" style="width: 50%;"></div></div>
        </div>
    </div>

    <div id="character-portrait"></div>

    <div class="dialogue-wrapper">
        <div id="dialogue-box">
            <div id="speaker">白梓</div>
            <div id="dialogue-text">載入中...</div>
            <div id="options-area"></div>
        </div>
    </div>
</div>

<script>
    // ---------- 遊戲狀態 ----------
    let stats = {
        stress: 50,
        calm: 50
    };
    let currentSceneId = "start";
    let currentDialogues = [];
    let dialogueIndex = 0;
    let pendingNextScene = null;
    let pendingPsychNote = null;
    let pendingPsychNoteEn = null;
    let nonsenseCount = 0;

    // ========== 音效映射 ==========
    function getMp3FromText(text) {
        let defaultFile = "click.mp3";
        if (text.includes("手機鈴聲") || text.includes("噔⬈噔")) return "ring.mp3";
        if (text.includes("咕咕嘎嘎?")) return "gu1.mp3";
        if (text.includes("咕咕嘎嘎！")) return "gu.mp3";
        if (text.includes("晚安")) return "goodnight.mp3";
        if (text.includes("哈基米喔南北綠豆")) return "song.mp3";
        if (text.includes("阿西嘎")) return "sigh.mp3";
        return defaultFile;
    }

    function playMp3ByText(text) {
        try {
            let file = getMp3FromText(text);
            let audio = new Audio(file);
            audio.volume = 0.5;
            audio.play().catch(e => console.log("音效播放失敗:", e));
        } catch(e) { console.log("音效支援錯誤"); }
    }

    // 顯示壓力/舒緩變化浮動提示
    function showStatChange(deltaStress, deltaCalm) {
        let msg = "";
        if (deltaStress !== 0) msg += `壓力 ${deltaStress > 0 ? "+" : ""}${deltaStress}  `;
        if (deltaCalm !== 0) msg += `舒緩 ${deltaCalm > 0 ? "+" : ""}${deltaCalm}`;
        if (msg === "") return;
        const toast = document.createElement("div");
        toast.className = "stat-toast";
        toast.innerText = msg.trim();
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 1500);
    }

    function updateUI() {
        document.getElementById('stress-fill').style.width = Math.min(100, Math.max(0, stats.stress)) + "%";
        document.getElementById('stress-val').innerText = stats.stress + "%";
        document.getElementById('calm-fill').style.width = Math.min(100, Math.max(0, stats.calm)) + "%";
        document.getElementById('calm-val').innerText = stats.calm + "%";
    }

    function addChange(stressDelta, calmDelta) {
        if (stressDelta !== undefined) {
            stats.stress += stressDelta;
            stats.calm += calmDelta;
            updateUI();
            showStatChange(stressDelta, calmDelta);
        }
    }

    // 處理對話文本：移除角色圖標記、播放音效、提取立繪文件名、提取背景圖標記
    function processDialogueLine(text, speaker) {
        let cleanText = text;
        let portraitFile = null;
        let bgFile = null;

        // 提取 (FUPx) 或 （FUPx） 標記（立繪）
        const fupMatch = cleanText.match(/[（(]FUP(\d+)(?:\.(\w+))?[）)]/);
        if (fupMatch) {
            let ext = fupMatch[2] ? `.${fupMatch[2]}` : ".png";
            portraitFile = `FUP${fupMatch[1]}${ext}`;
            cleanText = cleanText.replace(/[（(]FUP\d+(?:\.\w+)?[）)]/g, "").trim();
        }

        // 提取 (FUx) 或 （FUx） 標記（背景）
        const fuMatch = cleanText.match(/[（(]FU(\d+)(?:\.(\w+))?[）)]/);
        if (fuMatch) {
            let ext = fuMatch[2] ? `.${fuMatch[2]}` : ".png";
            bgFile = `FU${fuMatch[1]}${ext}`;
            cleanText = cleanText.replace(/[（(]FU\d+(?:\.\w+)?[）)]/g, "").trim();
        }

        // 處理音效
        if (cleanText.includes("（play mp3）") || cleanText.includes("(play mp3)")) {
            playMp3ByText(cleanText);
            cleanText = cleanText.replace(/[（(]play mp3[）)]/g, "").trim();
        }

        // 移除其他可能的角色圖舊標記（如（白梓圖））
        cleanText = cleanText.replace(/（[^）]*圖）|\([^)]*圖\)/g, "").trim();

        return { cleanText, portraitFile, bgFile };
    }

    // 設置全屏立繪（有圖片則顯示，否則隱藏）
    function setCharacterPortrait(portraitFile) {
        const portraitDiv = document.getElementById('character-portrait');
        if (portraitFile && portraitFile.trim() !== "") {
            portraitDiv.style.backgroundImage = `url('${portraitFile}')`;
            portraitDiv.style.display = "block";
        } else {
            portraitDiv.style.backgroundImage = "none";
            portraitDiv.style.display = "none";
        }
    }

    // 設置遊戲背景
    function setBackground(bgFile) {
        if (bgFile && bgFile.trim() !== "") {
            document.getElementById('game-container').style.backgroundImage = `url('${bgFile}')`;
        }
    }

    // ---------- 場景資料庫（中英對照）----------
    const scenes = {
        start: {
            bgZh: "背景：大學畢業禮堂，大家正準備拍畢業照。",
            bgEn: "Background: Graduation ceremony, everyone is taking photos.",
            bgImg: "FU1.png",
            dialogues: [
                { speaker: "旁白", text: "今天是你大學四年的畢業禮，你約了你的青梅竹馬白梓拍張照", textEn: "Today is your university graduation ceremony. You've arranged to take a photo with your childhood friend Bai Zi." },
                { speaker: "白梓", text: "嗨！原來你在這裡！和我一起拍個照吧，畢竟我們那麼多年的交情嘛！(FUP1)", textEn: "Hi! So you're here! Let's take a photo together—after all, we've known each other for so many years! (FUP1)" },
                { speaker: "你", text: "對啊，被你freeride那麼多年的交情呢（笑）", textEn: "Yeah, after you've been freeriding off our friendship for so many years (laughs)" },
                { speaker: "白梓", text: "哎呀，不要在意這些細節（咔嚓），對了，你之後有什麼打算？", textEn: "Oh, don't mind the details (click). So, what are your plans after this?" },
                { speaker: "白梓", text: "我聽阿甲阿乙和阿丙他們都想好之後要做什麼了。", textEn: "I heard A-Jia, A-Yi, and A-Bing all have plans." },
                { speaker: "白梓", text: "阿甲打算進修讀碩士，阿乙已經有大公司offer了，阿丙則是被富婆看上被包養了。", textEn: "A-Jia is going to pursue a master's degree, A-Yi already has an offer from a big company, and A-Bing was taken in by a wealthy woman." },
                { speaker: "白梓", text: "真是可惡啊，我也想被富婆包養呢。", textEn: "How annoying! I'd like to be taken in by a wealthy woman too." },
                { speaker: "白梓", text: "我還什麼都還沒想過呢，這就畢業了，大學我還沒玩夠呢。", textEn: "I haven't even thought about anything yet, and now I'm already graduating. I haven't had enough of university life." }
            ],
            options: [
                { text: "我早就開始準備了，現在offer也拿到了。", stressDelta: 17, calmDelta: -17, branch: "branch_offer" },
                { text: "我也還沒想過呢，現在再想也不晚", stressDelta: -17, calmDelta: 17, branch: "branch_same" },
                { text: "What the dog doing", stressDelta: -2, calmDelta: 2, branch: "branch_dog" }
            ]
        },
        branch_offer: {
            dialogues: [
                { speaker: "白梓", text: "怎麼你也準備好了，原來就我一個什麼都沒準備嗎！", textEn: "You've already prepared too? So I'm the only one who hasn't prepared anything!" },
                { speaker: "白梓", text: "這下可怎麼辦，現在開始想還來不來得及啊。", textEn: "What should I do now? Is it too late to start thinking?" }
            ],
            nextScene: "scene2",
            psychNote: "這是社會比較理論（Social Comparison Theory）的典型表現。白梓進行向上比較後，強烈感受到自己落後，產生未來焦慮。",
            psychNoteEn: "This is a classic example of Social Comparison Theory. After upward comparison, Bai Zi feels strongly left behind, generating future anxiety."
        },
        branch_same: {
            dialogues: [
                { speaker: "白梓", text: "我就知道我不是一個人！不管了，事已至此，先啟動吧！", textEn: "I knew I wasn't the only one! Never mind, let's just go with the flow for now!" },
                { speaker: "旁白", text: "你和白梓就暫時把問題拋諸腦後，玩起了遊戲。", textEn: "You and Bai Zi temporarily put aside your worries and start playing games." }
            ],
            nextScene: "scene2",
            psychNote: "你選擇與白梓建立共同處境認同（向下比較），短暫緩解了她的壓力。",
            psychNoteEn: "You choose to share a common situation with Bai Zi (downward comparison), temporarily relieving her stress."
        },
        branch_dog: {
            dialogues: [
                { speaker: "白梓", text: "BiBiLaBu （廢話）", textEn: "BiBiLaBu (nonsense)" }
            ],
            nextScene: "scene2",
            psychNote: "使用荒謔回應進行情緒轉移，類似社會學習理論中的輕鬆模仿行為。",
            psychNoteEn: "Using absurd responses for emotional diversion, similar to light-hearted modeling in Social Learning Theory."
        },

        scene2: {
            bgZh: "背景：一個月後的朋友聚會，卡拉OK包廂。",
            bgEn: "Background: One month later, karaoke party with friends.",
            bgImg: "FU2.jpg",
            dialogues: [
                { speaker: "旁白", text: "一個月後。", textEn: "One month later." },
                { speaker: "旁白", text: "你和你的老朋友們每隔一段時間就會相約聚會一次，白梓也是其中一員。", textEn: "You and your old friends meet up regularly, and Bai Zi is one of them." },
                { speaker: "旁白", text: "現在你們在唱卡拉ok。", textEn: "Now you're singing karaoke." },
                { speaker: "白梓", text: "哈基米喔南北綠豆♪（play mp3）(FUP2)", textEn: "Hakimi oh nanbei green bean♪ (play mp3) (FUP2)" },
                { speaker: "白梓", text: "阿西嘎...唉（play mp3）", textEn: "Ah... sigh (play mp3)" }
            ],
            options: [
                { text: "你怎麼了，怎麼唉聲歎氣的。", next: "q2_main", stressDelta: 0, calmDelta: 0, isSingle: true }
            ]
        },
        q2_main: {
            dialogues: [
                { speaker: "白梓", text: "自從畢業之後，我就開始找工作了。", textEn: "After graduation, I started looking for jobs." },
                { speaker: "白梓", text: "但我到處投了很多的簡歷，居然一點音訊也沒有。", textEn: "But I sent out so many resumes and haven't heard anything back." },
                { speaker: "白梓", text: "甚至就連快餐店都不要我，我起碼也是個大學生欸。", textEn: "Even fast food places don't want me. I'm at least a university graduate!" },
                { speaker: "白梓", text: "前路真是一片黑暗啊", textEn: "The road ahead is so dark..." }
            ],
            options: [
                { text: "笑死，想不到就連快餐店也不要你。", stressDelta: 17, calmDelta: -17, branch: "branch_ridicule" },
                { text: "你一個大學生怎麼可能快餐店都不請，是不是有哪裡搞錯了。", stressDelta: 17, calmDelta: -17, branch: "branch_doubt" },
                { text: "不用想那麼多，急也沒用，今天就專心玩，這些事情之後再想吧。", stressDelta: -17, calmDelta: 17, branch: "branch_distract" },
                { text: "你說得對，但你說得對。", stressDelta: -2, calmDelta: 2, branch: "branch_nonsense2" }
            ]
        },
        branch_ridicule: {
            dialogues: [
                { speaker: "旁白", text: "白梓露出一個尷尬且不失禮貌的笑容並拒絕作出回應。（自卑）（焦慮）", textEn: "Bai Zi shows an awkward but polite smile and refuses to respond. (Inferiority) (Anxiety)" }
            ],
            nextScene: "scene3",
            psychNote: "嘲諷式回應強化了白梓的向上社會比較與自卑感。",
            psychNoteEn: "Sarcastic response strengthens Bai Zi's upward social comparison and feelings of inferiority."
        },
        branch_doubt: {
            dialogues: [
                { speaker: "白梓", text: "我應該沒搞錯什麼啊，沒搞錯吧...（自我懷疑）", textEn: "I didn't make any mistake, did I...? (Self-doubt)" }
            ],
            nextScene: "scene3",
            psychNote: "質疑引發白梓的自我懷疑循環，加劇未來焦慮。",
            psychNoteEn: "Questioning triggers Bai Zi's self-doubt loop, worsening her future anxiety."
        },
        branch_distract: {
            dialogues: [
                { speaker: "白梓", text: "你說得對，現在光焦慮也沒什麼用。", textEn: "You're right. Worrying won't help right now." },
                { speaker: "白梓", text: "今天那麼難得約大家出來，必須玩個盡興！", textEn: "We rarely get together like this, so let's have fun!" }
            ],
            nextScene: "scene3",
            psychNote: "引導白梓轉向當下正面體驗，符合社會情感選擇理論。",
            psychNoteEn: "Guiding Bai Zi to focus on the present positive experience aligns with Socioemotional Selectivity Theory."
        },
        branch_nonsense2: {
            dialogues: [
                { speaker: "白梓", text: "對...對嗎？對哪了？（廢話）", textEn: "Right... right about what? (Nonsense)" }
            ],
            nextScene: "scene3",
            psychNote: "廢話式回應提供短暫情緒緩衝。",
            psychNoteEn: "Nonsensical response provides a brief emotional buffer."
        },
        scene2_tail: {
            dialogues: [
                { speaker: "旁白", text: "聚會自然的繼續下去，你們都玩的很開心。", textEn: "The party continues naturally, and everyone has a good time." },
                { speaker: "旁白", text: "但你始終感覺白梓有種不自然的感覺。", textEn: "But you always feel that Bai Zi seems a bit unnatural." }
            ],
            nextScene: "scene3"
        },

        scene3: {
            bgZh: "背景：深夜2點的臥室，天花板。",
            bgEn: "Background: 2 AM bedroom, ceiling.",
            bgImg: "FU3.avif",
            dialogues: [
                { speaker: "旁白", text: "噔⬈噔⮕噔⮕噔⬊噔⬊噔⮕噔⮕噔⬊ 。(手機鈴聲)（play mp3）", textEn: "Ring ring ring ring... (Phone ringing) (play mp3)" },
                { speaker: "旁白", text: "Your phone linging, your phone linging。（play mp3）", textEn: "Your phone linging, your phone linging. (play mp3)" },
                { speaker: "旁白", text: "Big boy, come pick up your phone。（play mp3）", textEn: "Big boy, come pick up your phone. (play mp3)" },

    // ---------- 流程控制 ----------
    function advanceDialogue() {
        const optArea = document.getElementById('options-area');
        if (dialogueIndex < currentDialogues.length) {
            const line = currentDialogues[dialogueIndex];
            const { cleanText, portraitFile, bgFile } = processDialogueLine(line.text, line.speaker);
            const textEn = line.textEn || "";
            let displayHtml = cleanText;
            if (textEn) displayHtml += `<div class="dialogue-en">${textEn}</div>`;
            document.getElementById('speaker').innerText = line.speaker;
            document.getElementById('dialogue-text').innerHTML = displayHtml;
            if (portraitFile) setCharacterPortrait(portraitFile);
            if (bgFile) setBackground(bgFile);
            dialogueIndex++;
            return;
        }
        if (pendingPsychNote) {
            let noteHtml = `<div class="psych-note">${pendingPsychNote}`;
            if (pendingPsychNoteEn) noteHtml += `<div class="psych-note-en">${pendingPsychNoteEn}</div>`;
            noteHtml += `</div>`;
            document.getElementById('dialogue-text').innerHTML += noteHtml;
            pendingPsychNote = null;
            pendingPsychNoteEn = null;
        }
        optArea.innerHTML = '';
        const contBtn = document.createElement('button');
        contBtn.className = 'continue-btn';
        contBtn.innerText = '繼續 →';
        contBtn.onclick = () => {
            if (pendingNextScene === "check_ending") {
                showEnding();
            } else {
                loadScene(pendingNextScene);
            }
        };
        optArea.appendChild(contBtn);
    }

    function loadScene(sceneId) {
        const scene = scenes[sceneId];
        if (!scene) return;
        document.getElementById('scene-zh').innerText = scene.bgZh || "背景";
        document.getElementById('scene-en').innerText = scene.bgEn || "";
        if (scene.bgImg) {
            setBackground(scene.bgImg);
        }

        currentDialogues = scene.dialogues ? [...scene.dialogues] : [];
        dialogueIndex = 0;
        pendingNextScene = null;
        pendingPsychNote = null;
        pendingPsychNoteEn = null;

        // 提取場景第一句的立繪標記
        let firstPortrait = null;
        if (currentDialogues.length > 0) {
            const firstText = currentDialogues[0].text;
            const fupMatch = firstText.match(/[（(]FUP(\d+)(?:\.(\w+))?[）)]/);
            if (fupMatch) {
                let ext = fupMatch[2] ? `.${fupMatch[2]}` : ".png";
                firstPortrait = `FUP${fupMatch[1]}${ext}`;
            }
        }

        // 判斷是否為主場景（有背景圖）
        const isMainScene = !!scene.bgImg;
        if (isMainScene) {
            setCharacterPortrait(firstPortrait);
        } else {
            if (firstPortrait) {
                setCharacterPortrait(firstPortrait);
            }
        }

        // 顯示第一句對話
        if (currentDialogues.length > 0) {
            const first = currentDialogues[0];
            const { cleanText, portraitFile, bgFile } = processDialogueLine(first.text, first.speaker);
            const textEn = first.textEn || "";
            let displayHtml = cleanText;
            if (textEn) displayHtml += `<div class="dialogue-en">${textEn}</div>`;
            document.getElementById('speaker').innerText = first.speaker;
            document.getElementById('dialogue-text').innerHTML = displayHtml;
            if (portraitFile) setCharacterPortrait(portraitFile);
            if (bgFile) setBackground(bgFile);
            dialogueIndex = 1;
        } else {
            document.getElementById('dialogue-text').innerHTML = "（沒有對話）";
        }

        const optArea = document.getElementById('options-area');
        optArea.innerHTML = '';
        const nextBtn = document.createElement('button');
        nextBtn.className = 'continue-btn';
        nextBtn.innerText = '繼續 →';
        nextBtn.onclick = () => {
            if (dialogueIndex < currentDialogues.length) {
                const line = currentDialogues[dialogueIndex];
                const { cleanText, portraitFile, bgFile } = processDialogueLine(line.text, line.speaker);
                const textEn = line.textEn || "";
                let displayHtml = cleanText;
                if (textEn) displayHtml += `<div class="dialogue-en">${textEn}</div>`;
                document.getElementById('speaker').innerText = line.speaker;
                document.getElementById('dialogue-text').innerHTML = displayHtml;
                if (portraitFile) setCharacterPortrait(portraitFile);
                if (bgFile) setBackground(bgFile);
                dialogueIndex++;
            } else {
                if (scene.options && scene.options.length > 0) {
                    showOptionsPanel(scene.options);
                } else if (scene.nextScene) {
                    loadScene(scene.nextScene);
                } else if (scene.final) {
                    showEnding();
                }
            }
        };
        optArea.appendChild(nextBtn);
    }

    function showOptionsPanel(options) {
        const optArea = document.getElementById('options-area');
        optArea.innerHTML = '';
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt.text;
            btn.onclick = () => {
                if (opt.stressDelta !== undefined) {
                    addChange(opt.stressDelta, opt.calmDelta);
                }
                if (opt.text.includes("What the dog doing") ||
                    opt.text.includes("你說得對，但你說得對") ||
                    opt.text.includes("咕咕嘎嘎") ||
                    opt.text.includes("一個晚上一個奇跡")) {
                    nonsenseCount++;
                }
                const branchScene = scenes[opt.branch];
                if (branchScene) {
                    currentDialogues = branchScene.dialogues ? [...branchScene.dialogues] : [];
                    dialogueIndex = 0;
                    pendingNextScene = branchScene.nextScene || "check_ending";
                    pendingPsychNote = branchScene.psychNote || null;
                    pendingPsychNoteEn = branchScene.psychNoteEn || null;
                    if (currentDialogues.length > 0) {
                        const first = currentDialogues[0];
                        const { cleanText, portraitFile, bgFile } = processDialogueLine(first.text, first.speaker);
                        const textEn = first.textEn || "";
                        let displayHtml = cleanText;
                        if (textEn) displayHtml += `<div class="dialogue-en">${textEn}</div>`;
                        document.getElementById('speaker').innerText = first.speaker;
                        document.getElementById('dialogue-text').innerHTML = displayHtml;
                        if (portraitFile) setCharacterPortrait(portraitFile);
                        if (bgFile) setBackground(bgFile);
                        dialogueIndex = 1;
                    } else {
                        document.getElementById('dialogue-text').innerHTML = "（繼續）";
                    }
                    optArea.innerHTML = '';
                    const contBtn = document.createElement('button');
                    contBtn.className = 'continue-btn';
                    contBtn.innerText = '繼續 →';
                    contBtn.onclick = () => advanceDialogue();
                    optArea.appendChild(contBtn);
                } else if (opt.next) {
                    loadScene(opt.next);
                } else {
                    showEnding();
                }
            };
            optArea.appendChild(btn);
        });
    }
